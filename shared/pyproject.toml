[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sog-shared"
version = "0.1.0"
description = "Pacote compartilhado entre API e Agente do SOG"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sog_shared*"]
