version: "3.8"

# Redes segmentadas: interna isolada (sem acesso à internet) para api/frontend;
# externa para nginx (ponto de entrada) e agente (precisa de internet para PJe/Datajud/SMTP).
# TLS interno entre containers está planejado para Wave 8 ou pós-MVP.
networks:
  sog-external:
    driver: bridge
  sog-internal:
    driver: bridge
    internal: true

services:
  agente:
    build:
      context: .
      dockerfile: agente/Dockerfile
    container_name: custas-agente
    env_file: .env.agente
    volumes:
      - ./dados:/dados
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    init: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: custas-api
    env_file: .env.api
    volumes:
      - ./dados:/dados
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - sog-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: custas-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m,mode=1777
      - /var/cache/nginx:noexec,nosuid,size=50m,mode=1777
      - /var/log/nginx:noexec,nosuid,size=10m,mode=1777
      - /run:noexec,nosuid,size=10m,mode=1777
    networks:
      - sog-internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine@sha256:dc48b7a872a79fb541ba5081d320b11b549231bc63ba465a7495afaa7d2ebcb8
    container_name: custas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m,mode=1777
      - /var/cache/nginx:noexec,nosuid,size=50m,mode=1777,uid=101,gid=101
      - /var/log/nginx:noexec,nosuid,size=10m,mode=1777,uid=101,gid=101
      - /run:noexec,nosuid,size=10m,mode=1777,uid=101,gid=101
    networks:
      - sog-external
      - sog-internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
