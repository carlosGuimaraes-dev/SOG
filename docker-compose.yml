version: "3.8"

services:
  agente:
    build:
      context: .
      dockerfile: agente/Dockerfile
    container_name: custas-agente
    env_file: .env
    volumes:
      - ./dados:/dados
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: custas-api
    env_file: .env
    volumes:
      - ./dados:/dados
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: custas-frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: custas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dados/screenshots:/usr/share/nginx/html/screenshots:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped
