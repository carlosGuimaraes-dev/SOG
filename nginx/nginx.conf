# Rate limiting zone para endpoints da API
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Descomente quando SSL estiver configurado:
# server { listen 80; return 301 https://$host$request_uri; }

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:47831 http://localhost:47831; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    # Descomente no bloco HTTPS quando SSL estiver ativo:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        set $frontend_upstream http://frontend:8080;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    location /api/v1/ {
        limit_req zone=api burst=20 nodelay;

        set $api_upstream http://api:8000;
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}
