  automation_boundary:
    condition: "all processes in the agent run reach an actionable automation outcome"
    exception_outcomes:
      - "pendente_manual"
      - "erro"
    review_status: "aguardando_aprovacao"
    successful_outcome: "guide ready for analysis and approval"
  backup_for_homologation: "sqlite only; no backup sidecar requirement"
  batch_definition:
    homologation_focus:
      - "idempotency"
      - "basic_bot_stress"
      - "assisted_real_execution"
    idempotency_expectation: "rerunning with already processed processes must not duplicate records, guides, critical logs, or PJE attachments; only explicitly rearmed processes can be processed again"
    identity:
      display_label: "cycle start date/time"
      preserve_uuid_on_pause_resume: true
      uuid: "required"
      uuid_visibility: "copyable in cycle detail; hidden from main table"
    membership: "new processes captured at trigger time plus previously known processes explicitly selected/rearmed by the user"
    membership_snapshot: "persist at cycle start"
    minimum_homologation_size: 10
    performance_expectation:
      hard_sla: false
      measurements:
        - "total_cycle_time"
        - "per_process_time"
        - "bottlenecks"
    rearm_mechanism:
      action: "Reprocessar"
      allowed_from:
        - "erro"
        - "pendente_manual"
        - "rejeitado"
      requirements:
        - "audit/log entry"
        - "state/flag that includes the process in the next Iniciar Agente batch"
      surface: "dashboard_process_detail"
    reprocessing: "only when explicitly selected/rearmed by the user"
    session_expiration_policy: "pause the cycle, notify the user to log in again, resume the same batch without duplicating completed work"
    source: "configured PJE folder/label"
    trigger: "user clicks Iniciar Agente"
  browser_mode:
    login: "interactive headed browser after user clicks Iniciar Agente"
    post_auth_until_review: "headless until every agent-selected process has its guide ready for user analysis and approval"
  dashboard_requirements:
    batch_history: "basic history of previous cycles"
    batch_history_membership: "use persisted cycle membership snapshot, not current process status inference"
    batch_view: true
    batch_view_purpose: "show current/last agent cycle, membership, aggregate progress, actionable outcomes, and exceptions"
    cycle_tab_layout: "compact summary plus process list; no charts required"
    design_principle: "less is more"
    expected_daily_volume: 50
    frontend_stack:
      component_system: "shadcn_ui"
      framework: "react_vite"
      note: "keep current React + Vite frontend; use shadcn/UI with the Vite template/configuration"
      preserve_existing_routes_and_flows_when_useful: true
      replacement_scope: "all_current_ui_components"
    historico_tab:
      includes:
        - "process_history"
        - "agent_cycle_history"
      separation_pattern: "simple_segmented_filter"
    iniciar_agente_behavior:
      disabled_while_cycle_running: true
      reason: "avoid concurrent cycles against PJE/SISTJWEB, storage state, and SQLite"
      when_paused_cycle_exists: "resume_paused_cycle_by_default_only"
    may_show_process_details: true
    navigation_pattern: "separated_tabs"
    parar_agente_behavior:
      control_pattern: "same_agent_control_button_changes_state"
      cycle_state: "paused_or_interrupted"
      manual_final_termination_in_scope: false
      mode: "cooperative_stop_after_current_step"
      no_complex_per_process_cancellation: true
      preserve_batch_snapshot: true
      preserve_cycle_uuid: true
      required: true
    post_login_home: "agent_cycle_panel"
    primary_home_elements:
      - "agent_status"
      - "iniciar_agente_action"
      - "current_or_last_cycle"
      - "batch_progress"
      - "status_counts"
      - "session_relogin_alerts"
      - "cycle_process_review_list"
    process_list_pattern: "compact_table"
    process_table_columns:
      - "Processo"
      - "Status"
      - "Etapa atual"
      - "Guia"
      - "Tempo"
      - "Acao"
    processos_tab:
      default_focus: "actionable_items"
      quick_filters: true
      scope: "all_processes"
    requires_authentication: true
    row_actions:
      aguardando_aprovacao: "Revisar"
      emitido: "Ver comprovante/detalhe"
      erro: "Ver erro or Reprocessar"
      pendente_manual: "Ver erro or Reprocessar"
      rejeitado: "Reprocessar"
      running: "status only; no primary action"
    session_relogin_ui:
      action: "Abrir login/continuar autenticacao if technically possible"
      pattern: "fixed_banner_top_of_cycle_tab"
    status_badges:
      legibility: "high"
      size: "small"
    status_colors:
