name: Snyk Compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  snyk-compat:
    name: Snyk compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run repo-native dependency audit
        id: audit
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: .github/scripts/run-snyk-compat-audit.sh

      - name: Publish Snyk-compatible status
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          AUDIT_STATUS: ${{ steps.audit.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const state = process.env.AUDIT_STATUS === 'success' ? 'success' : 'failure';
            const description = state === 'success'
              ? 'Repo-native dependency audit passed or was not required'
              : 'Repo-native dependency audit found a blocking issue';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state,
              context: 'security/snyk (carlosguimaraes-dev)',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
