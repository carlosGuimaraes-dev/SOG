name: SOG Desktop Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "agente/**"
      - "api/**"
      - "frontend/**"
      - "shared/**"
      - "nginx/**"
      - "docker-compose.desktop.yml"
      - ".github/workflows/sog-desktop-windows.yml"

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify desktop package contract
        working-directory: desktop
        run: npm run verify

      - name: Build Windows installer
        working-directory: desktop
        run: npm run build:win

      - name: Verify Windows installer artifact
        working-directory: desktop
        run: npm run verify:win-artifact

      - name: Verify upgrade preservation smoke script
        working-directory: desktop
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "sog-upgrade-preservation"
          npm run smoke:upgrade -- --Mode baseline --InstallRoot $root
          npm run smoke:upgrade -- --Mode verify --InstallRoot $root

      - name: Compute installer metadata
        shell: pwsh
        run: |
          $package = Get-Content "desktop/package.json" | ConvertFrom-Json
          $version = $package.version
          $installer = Get-ChildItem "desktop/dist/*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer .exe not found in desktop/dist"
          }
          $blockmap = Get-Item "$($installer.FullName).blockmap"
          $sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $shaFile = Join-Path $installer.DirectoryName "SOG.Desktop.Setup.$version.exe.sha256"
          "$sha256  SOG.Desktop.Setup.$version.exe" | Set-Content -Path $shaFile -Encoding ascii
          "INSTALLER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_SHA256=$sha256" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_FILE=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_BLOCKMAP_FILE=$($blockmap.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_SHA_FILE=$shaFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "INSTALLER_SHA256=$sha256"

      - name: Write build evidence summary
        shell: pwsh
        run: |
          "## SOG Desktop Windows evidence" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- npm run verify: passed" >> $env:GITHUB_STEP_SUMMARY
          "- npm run build:win: passed" >> $env:GITHUB_STEP_SUMMARY
          "- npm run verify:win-artifact: passed" >> $env:GITHUB_STEP_SUMMARY
          "- npm run smoke:upgrade baseline/verify: passed" >> $env:GITHUB_STEP_SUMMARY
          "- installer version: $env:INSTALLER_VERSION" >> $env:GITHUB_STEP_SUMMARY
          "- installer sha256: $env:INSTALLER_SHA256" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Manual evidence still required on an operator workstation: install the .exe, run smoke:win, start SOG Desktop, click Abrir Chrome para login, authenticate PJe/SISTJWEB, and confirm the agent resumes." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer to R2
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm exec --yes -- wrangler r2 object put "sogtj-releases/sogtj/v$env:INSTALLER_VERSION/SOG.Desktop.Setup.$env:INSTALLER_VERSION.exe" --remote --file="$env:INSTALLER_FILE" --content-type=application/octet-stream --cache-control="public, max-age=31536000, immutable"
          npm exec --yes -- wrangler r2 object put "sogtj-releases/sogtj/v$env:INSTALLER_VERSION/SOG.Desktop.Setup.$env:INSTALLER_VERSION.exe.blockmap" --remote --file="$env:INSTALLER_BLOCKMAP_FILE" --content-type=application/octet-stream --cache-control="public, max-age=31536000, immutable"
          npm exec --yes -- wrangler r2 object put "sogtj-releases/sogtj/v$env:INSTALLER_VERSION/SOG.Desktop.Setup.$env:INSTALLER_VERSION.exe.sha256" --remote --file="$env:INSTALLER_SHA_FILE" --content-type=text/plain --cache-control="public, max-age=300"

      - name: Upload installer artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sog-desktop-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
          if-no-files-found: error
