name: Quality Baseline

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Build And Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agente/requirements-dev.txt -r api/requirements.txt ./shared

      - name: Run Python tests
        run: pytest agente/tests api/tests shared/tests -q

  docker:
    name: Docker Config And Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose -f docker-compose.yml config -q

      - name: Build agent image
        run: docker build -f agente/Dockerfile .

      - name: Build API image
        run: docker build -f api/Dockerfile .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile .
