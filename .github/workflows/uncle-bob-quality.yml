name: Uncle Bob Quality

on:
  pull_request:
    paths:
      - "agente/**"
      - "api/**"
      - "frontend/**"
      - "shared/**"
      - "desktop/**"
      - ".github/workflows/uncle-bob-quality.yml"
  push:
    branches: [main]
    paths:
      - "agente/**"
      - "api/**"
      - "frontend/**"
      - "shared/**"
      - "desktop/**"
      - ".github/workflows/uncle-bob-quality.yml"
  workflow_dispatch:
  schedule:
    - cron: "21 7 * * 1"

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"
  COVERAGE_THRESHOLD: "80"
  COMPLEXITY_THRESHOLD: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r agente/requirements.txt
          pip install pytest pytest-cov ruff radon

      - name: Run Ruff
        run: ruff check agente api shared

      - name: Check cyclomatic complexity
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          result = subprocess.run(
              ["radon", "cc", "agente", "api", "shared", "-s", "-n", "C"],
              text=True,
              capture_output=True,
              check=False,
          )
          if result.returncode != 0:
              if result.stderr.strip():
                  print(result.stderr)
              sys.exit(result.returncode)
          if result.stdout.strip():
              print(result.stdout)
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary_file:
                      summary_file.write("### Python complexity advisory\n\n")
                      summary_file.write("```text\n")
                      summary_file.write(result.stdout.rstrip() + "\n")
                      summary_file.write("```\n\n")
              print("::warning::Python functions above complexity B were found. See the job summary for details.")
          PY

      - name: Check module sizes
        run: |
          python - <<'PY'
          import ast
          import os
          import sys
          from pathlib import Path

          failures = []
          for path in [*Path("agente").rglob("*.py"), *Path("api").rglob("*.py"), *Path("shared").rglob("*.py")]:
              if any(part in {"__pycache__", ".venv"} for part in path.parts):
                  continue
              lines = [line for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
              if len(lines) > 500:
                  failures.append(f"{path}: file has {len(lines)} non-blank lines")
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and hasattr(node, "end_lineno"):
                      size = node.end_lineno - node.lineno + 1
                      if size > 20:
                          failures.append(f"{path}:{node.lineno} {node.name}() has {size} lines")

          if failures:
              details = "\n".join(failures)
              print(details)
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as summary_file:
                      summary_file.write("### Python size advisory\n\n")
                      summary_file.write("```text\n")
                      summary_file.write(details + "\n")
                      summary_file.write("```\n\n")
              print("::warning::Python files or functions exceeded the advisory size limits. See the job summary for details.")
          PY

      - name: Run Python tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest api/tests agente/tests \
            --cov=api \
            --cov=agente/src \
            --cov=shared \
            --cov-report=term-missing \
            --cov-report=xml:coverage-python.xml \
            --cov-fail-under=${COVERAGE_THRESHOLD}

      - name: Upload Python coverage
        if: ${{ always() && vars.UPLOAD_COVERAGE_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage-python.xml
          if-no-files-found: ignore

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint

      - name: Check dependency structure
        run: |
          cat > dependency-cruiser.config.cjs <<'JS'
          module.exports = {
            forbidden: [
              {
                name: "no-circular",
                severity: "error",
                from: {},
                to: { circular: true },
              },
            ],
            options: {
              doNotFollow: { path: "node_modules" },
              tsPreCompilationDeps: true,
            },
          }
          JS
          npx --yes dependency-cruiser -c dependency-cruiser.config.cjs src
          rm -f dependency-cruiser.config.cjs

      - name: Run frontend coverage
        run: |
          npx vitest run --coverage \
            --coverage.thresholds.lines=${COVERAGE_THRESHOLD} \
            --coverage.thresholds.functions=${COVERAGE_THRESHOLD} \
            --coverage.thresholds.branches=${COVERAGE_THRESHOLD} \
            --coverage.thresholds.statements=${COVERAGE_THRESHOLD}

      - name: Upload frontend coverage
        if: ${{ always() && vars.UPLOAD_COVERAGE_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  desktop-quality:
    name: Desktop quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --include=dev

      - name: Run desktop verification
        run: npm run verify

  mutation-readiness:
    name: Mutation readiness
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install mutation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r agente/requirements.txt
          pip install pytest pytest-cov mutmut
          npm ci --prefix frontend --include=dev
          npm install --prefix frontend --no-save @stryker-mutator/core @stryker-mutator/vitest-runner --legacy-peer-deps || true

      - name: Run Python mutation smoke
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: mutmut run --paths-to-mutate shared --runner "pytest agente/tests api/tests" || true

      - name: Run frontend mutation smoke
        working-directory: frontend
        run: npx stryker run --dry-run || true
