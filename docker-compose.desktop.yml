networks:
  sog-external:
    driver: bridge
  sog-internal:
    driver: bridge
    internal: true

services:
  api:
    image: ${SOG_API_IMAGE:-sog-api:local}
    pull_policy: ${SOG_IMAGE_PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: custas-api
    env_file: ${SOG_ENV_API}
    volumes:
      - type: bind
        source: ${SOG_DATA_DIR}
        target: /dados
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - sog-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ${SOG_FRONTEND_IMAGE:-sog-frontend:local}
    pull_policy: ${SOG_IMAGE_PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: custas-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m,mode=1777
      - /var/cache/nginx:noexec,nosuid,size=50m,mode=1777
      - /var/log/nginx:noexec,nosuid,size=10m,mode=1777
      - /run:noexec,nosuid,size=10m,mode=1777
    networks:
      - sog-internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine@sha256:dc48b7a872a79fb541ba5081d320b11b549231bc63ba465a7495afaa7d2ebcb8
    container_name: custas-nginx
    ports:
      - "${SOG_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m,mode=1777
      - /var/cache/nginx:noexec,nosuid,size=50m,mode=1777,uid=101,gid=101
      - /var/log/nginx:noexec,nosuid,size=10m,mode=1777,uid=101,gid=101
      - /run:noexec,nosuid,size=10m,mode=1777,uid=101,gid=101
    networks:
      - sog-external
      - sog-internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
